<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навігаційний портал застосунків (ЛР №7–10)</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="module" src="js/script.js" defer></script>
</head>
<body>
    <div class="container-xl portal-wrapper d-flex flex-column gap-4 py-4 px-3">
        <header class="portal-header d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 p-4 rounded-4">
            <div class="brand-block">
                <h1 class="h3 fw-bold mb-1">Портал веб-застосунків (ЛР №7–10)</h1>
                <p class="brand-subtitle mb-0">Єдиний модульний інтерфейс навігації між лабораторними роботами</p>
            </div>

            <div class="header-actions d-flex align-items-center gap-2">
                <button type="button" id="open-history-btn" class="btn btn-portal-secondary px-3 py-2">
                    Історія переходів
                </button>
            </div>
        </header>

        <div id="main-menu-view" class="main-menu-view">
            <div id="status-banner" class="alert access-banner mb-3" role="status"></div>

            <main class="catalog-section">
                <div id="labs-grid" class="row g-4"></div>
            </main>
        </div>

        <section id="lab-viewer-section" class="lab-viewer-section rounded-4 overflow-hidden" aria-label="Перегляд застосунку">
            <div class="viewer-toolbar d-flex flex-column flex-lg-row justify-content-between align-items-stretch align-items-lg-center gap-3 p-3 px-md-4">
                <div class="viewer-left d-flex flex-column flex-sm-row align-items-stretch align-items-sm-center justify-content-between gap-3">
                    <button type="button" id="back-to-menu-btn" class="btn btn-portal-secondary px-3 py-2">
                        &larr; До головного меню
                    </button>
                    <div class="viewer-title-group d-flex align-items-center gap-2">
                        <span id="viewer-lab-badge" class="badge rounded-pill px-3 py-2 lab-badge lab-7">ЛР №7</span>
                        <h2 id="viewer-lab-title" class="viewer-title h5 fw-bold mb-0">Назва застосунку</h2>
                    </div>
                </div>

                <div class="viewer-right d-flex flex-column flex-sm-row align-items-stretch align-items-sm-center justify-content-between gap-3">
                    <div class="viewer-switch-group d-flex flex-wrap gap-2" role="group" aria-label="Швидке перемикання робіт">
                        <button type="button" class="btn viewer-switch-btn" data-lab-id="lab7">ЛР 7</button>
                        <button type="button" class="btn viewer-switch-btn" data-lab-id="lab8">ЛР 8</button>
                        <button type="button" class="btn viewer-switch-btn" data-lab-id="lab9">ЛР 9</button>
                        <button type="button" class="btn viewer-switch-btn" data-lab-id="lab10">ЛР 10</button>
                    </div>
                    <a
                        id="viewer-external-link"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="btn btn-portal-primary fw-semibold px-3 py-2"
                    >
                        У новій вкладці &#8599;
                    </a>
                </div>
            </div>

            <div class="iframe-container w-100">
                <iframe
                    id="lab-iframe"
                    class="lab-iframe w-100 h-100 border-0 d-block"
                    src="about:blank"
                    title="Вбудований перегляд лабораторної роботи"
                ></iframe>
            </div>
        </section>

        <footer class="portal-footer text-center pt-3 pb-2">
            <p class="mb-0">Лабораторна робота №13 (HTML5, CSS3, Bootstrap 5, jQuery)</p>
        </footer>
    </div>

    <div id="history-modal" class="modal-overlay p-3" role="dialog" aria-modal="true" aria-labelledby="history-modal-title">
        <div class="modal-window rounded-4 p-4 mx-auto my-4">
            <div class="modal-header-bar d-flex justify-content-between align-items-center pb-3 mb-3">
                <h2 id="history-modal-title" class="modal-title h5 fw-bold mb-0">Історія переходів до застосунків</h2>
                <button type="button" id="close-history-btn" class="btn-close-modal bg-transparent border-0" aria-label="Закрити">&times;</button>
            </div>
            <div class="table-responsive history-table-wrap rounded-3">
                <table class="table table-dark table-hover align-middle mb-0 portal-table">
                    <thead>
                        <tr>
                            <th scope="col" class="px-3 py-2">Час</th>
                            <th scope="col" class="px-3 py-2">Застосунок</th>
                            <th scope="col" class="px-3 py-2">URL</th>
                        </tr>
                    </thead>
                    <tbody id="history-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
